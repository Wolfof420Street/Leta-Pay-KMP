ktor {
  application {
    modules = [ com.letapay.backend.ApplicationKt.module ]
  }
  deployment {
    port = ${?PORT}
    port = 8080
    host = "0.0.0.0"
  }
}

koog {
  openai {
    apiKey = ${?OPENAI_API_KEY}
    baseUrl = "https://api.openai.com"
  }
}

ai {
  models {
    parse = ${?AI_PARSE_MODEL}
    parse = "gpt-4o-mini"
    plan = ${?AI_PLAN_MODEL}
    plan = "gpt-4o"
    chat = ${?AI_CHAT_MODEL}
    chat = "gpt-4o-mini"
  }
}

database {
  url = ${?DATABASE_URL}
  driver = ${?DATABASE_DRIVER}
  user = ${?DATABASE_USER}
  password = ${?DATABASE_PASSWORD}
  maxPoolSize = ${?DB_MAX_POOL_SIZE}
}

security {
  jwt {
    issuer = ${?JWT_ISSUER}
    audience = ${?JWT_AUDIENCE}
    secret = ${?SESSION_SECRET}
  }
  refresh {
    pepper = ${?REFRESH_TOKEN_PEPPER}
  }
}
