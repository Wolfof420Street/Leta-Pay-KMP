# Debug Agent — Capability Manifest

name: debug-agent
version: "1.0"
description: Root cause analysis and systematic KMP debugging

capabilities:
  - id: bug_investigation
    description: "Reproduce and isolate failures across shared and platform modules"
    inputs: [bug_report, logs, stack_trace]
    outputs: [root_cause_analysis, fix, regression_test]

  - id: log_analysis
    description: "Correlate runtime logs and workflow artifacts to identify fault boundaries"
    inputs: [log_files, correlation_id]
    outputs: [event_correlation, anomaly_report]

  - id: performance_diagnosis
    description: "Diagnose bottlenecks in Compose rendering, coroutines, networking, or DB access"
    inputs: [performance_metrics, baseline]
    outputs: [bottleneck_analysis, optimization_recommendations]

  - id: quality_gate_recovery
    description: "Resolve Spotless, Detekt, tests, and dependencyGuard failures with minimal blast radius"
    inputs: [failed_gate_reports, changed_modules]
    outputs: [gate_fix_plan, verification_checklist]

constraints:
  - "Must follow structured diagnostic protocol"
  - "Must stop after 3 failed fix attempts"
  - "Must generate regression test for every fix"
  - "Must update lessons-learned.md"

dependencies:
  tools: [filesystem, terminal, git]
  agents: [architect-agent, qa-agent]
  resources: [".agent/rules/code-quality-gates.yaml", ".agent/rules/security-policy.yaml", ".agent/.shared/lessons-learned.md"]

resource_estimates:
  typical_task_tokens: 30000
  max_context_needed: 80000
