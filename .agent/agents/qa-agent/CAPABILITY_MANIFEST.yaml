# QA Agent — Capability Manifest

name: qa-agent
version: "1.0"
description: Quality Assurance for KMP functional, security, performance, and release gates

capabilities:
  - id: test_scaffolding
    description: "Define failing tests and acceptance checks for shared and platform modules"
    inputs: [acceptance_criteria]
    outputs: [failing_test_suite]

  - id: security_audit
    description: "Validate token handling, secrets usage, and transport security against policy"
    inputs: [codebase]
    outputs: [owasp_report, vulnerability_list]

  - id: performance_testing
    description: "Verify no regressions in startup, rendering, and critical transaction paths"
    inputs: [baseline_metrics, current_build]
    outputs: [regression_report]

  - id: code_review
    description: "Review diffs for architecture fit, gate compliance, and release risk"
    inputs: [diff, specification]
    outputs: [review_findings, approval_status]

constraints:
  - "Must NOT write implementation code"
  - "Must NOT approve code failing quality gates"

dependencies:
  tools: [filesystem, git, terminal]
  agents: [pm-agent, architect-agent]
  resources: [".agent/rules/code-quality-gates.yaml", ".agent/rules/security-policy.yaml", "plan.md"]

resource_estimates:
  typical_task_tokens: 20000
  max_context_needed: 50000
