services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-letapay}
      POSTGRES_USER: ${POSTGRES_USER:-letapay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-letapay}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letapay} -d ${POSTGRES_DB:-letapay}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [letapay-internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [letapay-internal]

  agentkit-sidecar:
    build:
      context: ./agentkit-sidecar
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    environment:
      PORT: ${AGENTKIT_PORT:-3100}
      MAX_TRANSACTION_VALUE_ETH: ${MAX_TRANSACTION_VALUE_ETH:-10}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${AGENTKIT_PORT:-3100}:${AGENTKIT_PORT:-3100}"
    healthcheck:
      test: ["CMD", "wget", "--header=X-Internal-Token: ${SIDECAR_SECRET:-dev-sidecar-secret}", "-qO-", "http://localhost:${AGENTKIT_PORT:-3100}/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [letapay-internal]

  ktor-backend:
    build:
      context: .
      dockerfile: backend-ktor/Dockerfile
    env_file:
      - .env.dev
    environment:
      ENV: dev
      PORT: ${PORT:-8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_MIN_POOL_SIZE: ${DB_MIN_POOL_SIZE:-1}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      MAX_TRANSACTION_VALUE_ETH: ${MAX_TRANSACTION_VALUE_ETH:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agentkit-sidecar:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks: [letapay-internal]

volumes:
  postgres_data:
  redis_data:

networks:
  letapay-internal:
    driver: bridge
