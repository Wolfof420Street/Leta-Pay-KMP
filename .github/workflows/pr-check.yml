## Overview
#
# This reusable GitHub Actions workflow provides a comprehensive Continuous Integration (CI) pipeline
# for multi-platform mobile and desktop applications, specifically designed for projects using Gradle and Java/Kotlin.
#
### Key Features
# - Automated code quality checks
# - Dependency management and verification
# - Cross-platform desktop application builds (Windows, Linux, MacOS)
# - Android APK build generation
# - Artifact generation and storage
#
### Workflow Jobs
# 1. **Setup**: Prepares the build environment
#   - Checks out repository code
#   - Sets up Java 17
#   - Configures Gradle
#   - Manages dependency caching
#
# 2. **Code Quality Checks**:
#   - Build logic verification
#   - Code formatting checks (Spotless)
#   - Static code analysis (Detekt)
#
# 3. **Dependency Guard**:
#   - Verifies dependencies against baseline
#   - Prevents unauthorized dependency changes
#   - Supports automatic baseline updates
#
# 4. **Android App Build**:
#   - Builds debug APK for demo flavor
#   - Uploads APK artifacts
#
# 5. **Desktop App Build**:
#   - Builds applications for Windows, Linux, and MacOS
#   - Generates platform-specific executables and packages
#
### Prerequisites
#   - Java 17
#   - Gradle
#   - Configured build scripts for:
#       - Android module
#       - Desktop module
#   - Installed Gradle plugins:
#       - Spotless
#       - Detekt
#       - Dependency Guard
#
### Configuration Parameters
# The workflow requires two input parameters:
#
#   |         Parameter      |              Description           |  Type  | Required |
#   |------------------------|------------------------------------|--------|----------|
#   | `android_package_name` | Name of the Android project module | String |    Yes   |
#   | `desktop_package_name` | Name of the Desktop project module | String |    Yes   |
#

# https://github.com/openMF/mifos-x-actionhub/blob/main/.github/workflows/pr-check.yaml

# ##############################################################################
#                 DON'T EDIT THIS FILE UNLESS NECESSARY                        #
# ##############################################################################


name: Leta Pay CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Monorepo (Serial)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agentkit-sidecar/package-lock.json

      - name: Sidecar install + compile
        working-directory: agentkit-sidecar
        run: |
          npm ci
          npm run build

      - name: Backend spotlessCheck
        run: ./gradlew --no-daemon --no-configuration-cache :backend-ktor:spotlessCheck

      - name: Backend detekt
        run: ./gradlew --no-daemon --no-configuration-cache :backend-ktor:detekt

      - name: Backend test
        run: ./gradlew --no-daemon --no-configuration-cache :backend-ktor:test

      - name: Web compile
        run: ./gradlew --no-daemon --no-configuration-cache :cmp-web:compileKotlinJs

      - name: Web distribution build
        run: ./gradlew --no-daemon --no-configuration-cache :cmp-web:jsBrowserDistribution
